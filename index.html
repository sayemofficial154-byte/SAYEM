<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAIYAN Play Store | Premium APK</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="অ্যাপ ও গেম খুঁজুন..." onkeyup="filterApps()">
    </div>
</header>

<div class="tabs">
    <button class="active">সব</button>
    <button>গেমস</button>
    <button>অ্যাপস</button>
    <button>নতুন</button>
</div>

<main class="container">
    <h2 class="section-title">জনপ্রিয় অ্যাপসমূহ</h2>
    <div class="app-grid" id="appGrid">
        
        <div class="app-card" onclick="goToDownload('CapCut Premium', 'v10.5.0', '120MB', 'https://github.com/zaiyan/repo/releases/download/v1/capcut.apk', 'https://img.icons8.com/color/144/capcut.png')">
            <img src="https://img.icons8.com/color/144/capcut.png" loading="lazy">
            <div class="app-info">
                <span class="name">CapCut Premium</span>
                <span class="category">Video Editor • 120MB</span>
                <span class="rating">4.8 ★</span>
            </div>
        </div>

        <div class="app-card" onclick="goToDownload('GTA Kishoreganj', 'v1.0', '1.2GB', 'https://github.com/zaiyan/repo/releases/download/v1/gta.apk', 'https://img.icons8.com/color/144/gta-5.png')">
            <img src="https://img.icons8.com/color/144/gta-5.png" loading="lazy">
            <div class="app-info">
                <span class="name">GTA Kishoreganj</span>
                <span class="category">Action • 1.2GB</span>
                <span class="rating">5.0 ★</span>
            </div>
        </div>

    </div>
</main>

<nav class="bottom-nav">
    <div class="nav-item active"><i class="fas fa-gamepad"></i><span>গেমস</span></div>
    <div class="nav-item"><i class="fas fa-th"></i><span>অ্যাপস</span></div>
    <div class="nav-item"><i class="fas fa-arrow-down"></i><span>আপডেট</span></div>
</nav>

<script>
    function filterApps() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('app-card');
        for (let card of cards) {
            let name = card.querySelector('.name').innerText.toLowerCase();
            card.style.display = name.includes(input) ? "flex" : "none";
        }
    }

    function goToDownload(name, ver, size, link, icon) {
        const url = `download.html?name=${encodeURIComponent(name)}&ver=${ver}&size=${size}&link=${encodeURIComponent(link)}&icon=${encodeURIComponent(icon)}`;
        window.location.href = url;
    }
</script>
</body>
</html>
