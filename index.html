<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAIYAN MODS | Premium Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">ZAIYAN <span>MODS</span></div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="অ্যাপ খুঁজুন..." onkeyup="filterApps()">
        <i class="fas fa-search"></i>
    </div>
</header>

<div class="hero-banner">
    <h3>PREMIUM UNLOCKER</h3>
    <p>সব প্রিমিয়াম অ্যাপ এখন আপনার হাতের মুঠোয়</p>
</div>

<main class="container">
    <div class="section-header">
        <h2>🔥 টপ মড অ্যাপস</h2>
        <span class="view-all">সব দেখুন</span>
    </div>
    
    <div class="app-grid" id="appGrid">
        <div class="app-card" onclick="goToDownload('CapCut Pro', 'v10.5', '120MB', 'LINK_HERE', 'https://img.icons8.com/color/144/capcut.png')">
            <div class="badge">PRO</div>
            <img src="https://img.icons8.com/color/144/capcut.png" loading="lazy">
            <div class="app-info">
                <span class="name">CapCut Pro</span>
                <span class="stars">⭐⭐⭐⭐⭐</span>
            </div>
        </div>

        <div class="app-card" onclick="goToDownload('GTA Kishoreganj', 'v1.0', '1.2GB', 'LINK_HERE', 'https://img.icons8.com/color/144/gta-5.png')">
            <div class="badge">MOD</div>
            <img src="https://img.icons8.com/color/144/gta-5.png" loading="lazy">
            <div class="app-info">
                <span class="name">GTA Kishoreganj</span>
                <span class="stars">⭐⭐⭐⭐⭐</span>
            </div>
        </div>
    </div>
</main>

<nav class="bottom-nav">
    <div class="nav-item active"><i class="fas fa-fire"></i><span>হট</span></div>
    <div class="nav-item"><i class="fas fa-gamepad"></i><span>গেমস</span></div>
    <div class="nav-item"><i class="fas fa-download"></i><span>ডাউনলোড</span></div>
</nav>

<script>
    function filterApps() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('app-card');
        for (let card of cards) {
            let name = card.querySelector('.name').innerText.toLowerCase();
            card.style.display = name.includes(input) ? "block" : "none";
        }
    }

    function goToDownload(name, ver, size, link, icon) {
        const url = `download.html?name=${encodeURIComponent(name)}&ver=${ver}&size=${size}&link=${encodeURIComponent(link)}&icon=${encodeURIComponent(icon)}`;
        window.location.href = url;
    }
</script>
</body>
</html>
